# NATS des Value-Analyzer (D1.5, docs/architecture/depot/nutzer.md Regel 11, events.md).
#
# Ein Nutzer je Dienst, Rechte nur auf die eigenen Subjects. Die Passwoerter kommen aus der
# Umgebung des Containers ($NATS_..._PASSWORD, aus der .env). Was nicht erlaubt ist, ist verboten.
#
# - Events (JetStream, Stream VA_EVENTS): jeder sendet nur seine eigenen und va.screening.run.failed
#   (Dead Letter). Gelesen wird nur ueber den eigenen durable Consumer, nicht direkt ueber va.>.
# - Request/Reply (rpc.va.<dienst>.…): nur der Besitzer antwortet (allow_responses), nur das
#   web-api fragt.
# - Eigene Inbox je Nutzer (_INBOX.<nutzer>, va_platform.nats.inbox_prefix): Mit _INBOX.> laese
#   jeder die Antworten an alle anderen mit.
# - Den Stream umstellen (STREAM.UPDATE) darf nur batch; die Dienste legen ihn nur an.
# - Private Events (D1.6, Stream VA_PRIVATE, priv.va.>): nur das web-api sendet sie, nur
#   notification liest sie ueber notification-private. Die anderen Dienste sehen den Stream nicht.
# - batch: alle Rechte, fuer den Batch ueber NATS (EVENT_BUS=nats), src.worker und
#   make nats-provision. Er hat ohnehin alle Rechte in der Datenbank (va_app).
#
# Die Tests: tests/test_nats_permissions.py (gegen einen NATS mit dieser Datei) und der E2E-Stack.

port: 4222
http_port: 8222
server_name: va-nats

jetstream {
  store_dir: /data
}

authorization {
  users = [
    {
      user: "market-data"
      password: $NATS_MARKET_DATA_PASSWORD
      permissions: {
        publish: {
          allow: [
            "$JS.API.INFO",
            "$JS.API.STREAM.INFO.VA_EVENTS",
            "$JS.API.STREAM.CREATE.VA_EVENTS",
            "$JS.API.CONSUMER.INFO.VA_EVENTS.market-data",
            "$JS.API.CONSUMER.CREATE.VA_EVENTS.market-data",
            "$JS.API.CONSUMER.CREATE.VA_EVENTS.market-data.>",
            "$JS.API.CONSUMER.DURABLE.CREATE.VA_EVENTS.market-data",
            "$JS.API.CONSUMER.MSG.NEXT.VA_EVENTS.market-data",
            "$JS.ACK.VA_EVENTS.market-data.>",
            "va.marketdata.>",
            "va.screening.run.failed",
            "live.va.marketdata.>"
          ]
        }
        subscribe: { allow: ["_INBOX.market-data.>"] }
      }
    },
    {
      user: "scoring"
      password: $NATS_SCORING_PASSWORD
      permissions: {
        publish: {
          allow: [
            "$JS.API.INFO",
            "$JS.API.STREAM.INFO.VA_EVENTS",
            "$JS.API.STREAM.CREATE.VA_EVENTS",
            "$JS.API.CONSUMER.INFO.VA_EVENTS.scoring",
            "$JS.API.CONSUMER.CREATE.VA_EVENTS.scoring",
            "$JS.API.CONSUMER.CREATE.VA_EVENTS.scoring.>",
            "$JS.API.CONSUMER.DURABLE.CREATE.VA_EVENTS.scoring",
            "$JS.API.CONSUMER.MSG.NEXT.VA_EVENTS.scoring",
            "$JS.ACK.VA_EVENTS.scoring.>",
            "va.scoring.>",
            "va.screening.run.failed"
          ]
        }
        subscribe: { allow: ["_INBOX.scoring.>", "rpc.va.scoring.>"] }
        allow_responses: true
      }
    },
    {
      user: "notification"
      password: $NATS_NOTIFICATION_PASSWORD
      permissions: {
        publish: {
          allow: [
            "$JS.API.INFO",
            "$JS.API.STREAM.INFO.VA_EVENTS",
            "$JS.API.STREAM.CREATE.VA_EVENTS",
            "$JS.API.CONSUMER.INFO.VA_EVENTS.notification",
            "$JS.API.CONSUMER.CREATE.VA_EVENTS.notification",
            "$JS.API.CONSUMER.CREATE.VA_EVENTS.notification.>",
            "$JS.API.CONSUMER.DURABLE.CREATE.VA_EVENTS.notification",
            "$JS.API.CONSUMER.MSG.NEXT.VA_EVENTS.notification",
            "$JS.ACK.VA_EVENTS.notification.>",
            # D1.6: Bestaetigungsmails aus VA_PRIVATE
            "$JS.API.STREAM.INFO.VA_PRIVATE",
            "$JS.API.STREAM.CREATE.VA_PRIVATE",
            "$JS.API.CONSUMER.INFO.VA_PRIVATE.notification-private",
            "$JS.API.CONSUMER.CREATE.VA_PRIVATE.notification-private",
            "$JS.API.CONSUMER.CREATE.VA_PRIVATE.notification-private.>",
            "$JS.API.CONSUMER.DURABLE.CREATE.VA_PRIVATE.notification-private",
            "$JS.API.CONSUMER.MSG.NEXT.VA_PRIVATE.notification-private",
            "$JS.ACK.VA_PRIVATE.notification-private.>",
            "va.notification.>",
            "va.screening.run.failed"
          ]
        }
        subscribe: { allow: ["_INBOX.notification.>", "rpc.va.notification.>"] }
        allow_responses: true
      }
    },
    {
      user: "web-api"
      password: $NATS_WEB_API_PASSWORD
      permissions: {
        publish: {
          allow: [
            "$JS.API.INFO",
            "$JS.API.STREAM.INFO.VA_EVENTS",
            "$JS.API.STREAM.CREATE.VA_EVENTS",
            # Nachspielen verpasster Events am WebSocket (realtime/replay.py)
            "$JS.API.STREAM.MSG.GET.VA_EVENTS",
            "$JS.API.CONSUMER.INFO.VA_EVENTS.web-api",
            "$JS.API.CONSUMER.CREATE.VA_EVENTS.web-api",
            "$JS.API.CONSUMER.CREATE.VA_EVENTS.web-api.>",
            "$JS.API.CONSUMER.DURABLE.CREATE.VA_EVENTS.web-api",
            "$JS.API.CONSUMER.MSG.NEXT.VA_EVENTS.web-api",
            "$JS.ACK.VA_EVENTS.web-api.>",
            # Runs anlegen, der Watchdog meldet haengende als gescheitert
            "va.screening.run.requested",
            "va.screening.run.failed",
            # D1.6: Bestaetigungsmails ueber VA_PRIVATE, ohne dort zu lesen
            "$JS.API.STREAM.INFO.VA_PRIVATE",
            "$JS.API.STREAM.CREATE.VA_PRIVATE",
            "priv.va.identity.>",
            "rpc.va.scoring.>",
            "rpc.va.notification.>"
          ]
        }
        # Fortschritt der Abrufe (fluechtig, an den Stream vorbei)
        subscribe: { allow: ["_INBOX.web-api.>", "live.va.>"] }
      }
    },
    {
      user: "batch"
      password: $NATS_BATCH_PASSWORD
      permissions: {
        publish: { allow: [">"] }
        subscribe: { allow: [">"] }
      }
    }
  ]
}

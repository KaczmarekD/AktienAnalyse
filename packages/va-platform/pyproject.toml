[project]
name = "va-platform"
version = "0.1.0"
description = "Gemeinsame Infrastruktur der Services - keine Fachlogik"
requires-python = ">=3.14"
dependencies = [
    "va-contracts",
    "sqlalchemy>=2.1,<3",  # wie im Root-Projekt (DB-Basis, P1.7)
]

[build-system]
requires = ["uv_build>=0.12.21,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
va-contracts = { workspace = true }

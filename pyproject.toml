[project]
name = "value-analyzer"
version = "0.3.0"
description = "Batchweise Value-Aktien-Analyse fuer DAX und MDAX mit wochentlichem E-Mail-Versand"
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Dennis" }]
license = { text = "Proprietary" }
dependencies = [
    "yfinance>=1.7,<2",       # ab 1.1 kompatibel mit pandas 3; curl_cffi bleibt Standard
    "pandas>=3.0,<4",
    "numpy>=2.3.2,<3",       # erste Version mit Wheels fuer Python 3.14
    "requests>=2.32,<3",
    "openpyxl>=3.1,<4",       # Deka-XLSX (Universum)
    "jinja2>=3.1,<4",
    "pyarrow>=22,<26",        # Altdaten-Import (Parquet); ab 22 Wheels fuer Python 3.14
    "tenacity>=9,<10",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.4,<3",
    "email-validator>=2.0,<3",
    "sqlalchemy>=2.1,<3",
    "psycopg[binary]>=3.3,<4",
    "alembic>=1.20,<2",
    # Workspace-Mitglieder, die der Batch zur Laufzeit nutzt (ab P1.3)
    "va-market-data",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "pandas-stubs>=3.0",
    "types-requests>=2.32",
    "import-linter>=2.15,<3",  # Grenzen zwischen den Workspace-Paketen (P1.1)
    # Uebrige Workspace-Mitglieder (P1.1): fuer Tests, Pyright und import-linter. Ins Image
    # kommen sie, sobald der Batch sie nutzt - dann oben unter dependencies.
    "va-contracts",
    "va-platform",
    "va-scoring",
    "va-notification",
]

# ----------------------------------------------------------------------------
# uv: Workspace-Root (ADR-0004). Abhaengigkeiten stehen oben, die exakten
# Versionen in uv.lock. Aendern: pyproject anpassen, dann `make lock`.
# ----------------------------------------------------------------------------
[tool.uv]
# Anwendung, kein installierbares Paket: Container und Tests starten aus dem
# Repo-Root (python -m src.main), wie bisher mit pip-tools.
package = false
# Gleiche uv-Minor-Version lokal, in der CI und im Docker-Build (reproduzierbare Locks)
required-version = ">=0.12.21,<0.13"

[tool.uv.workspace]
# Geteilte Pakete und Services (ADR-0004, docs/architecture/code-struktur.md)
members = ["packages/*", "services/*"]

[tool.uv.sources]
va-contracts = { workspace = true }
va-platform = { workspace = true }
va-market-data = { workspace = true }
va-scoring = { workspace = true }
va-notification = { workspace = true }

# ----------------------------------------------------------------------------
# import-linter: Grenzen zwischen den Workspace-Paketen (ADR-0004, P1.1).
# Details: docs/architecture/code-struktur.md. Pruefen: make imports.
# ----------------------------------------------------------------------------
[tool.importlinter]
root_packages = [
    "va_contracts",
    "va_platform",
    "va_market_data",
    "va_scoring",
    "va_notification",
    "src",  # Altbestand, bis Phase 1 ihn aufgeloest hat
]
# Auch Drittpakete im Graphen, damit Vertraege sie verbieten koennen
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Services importieren einander nicht"
type = "independence"
modules = ["va_market_data", "va_scoring", "va_notification"]

[[tool.importlinter.contracts]]
name = "Schichten innerhalb jedes Service"
type = "layers"
layers = ["entrypoints", "adapters", "application", "domain"]
containers = ["va_market_data", "va_scoring", "va_notification"]

[[tool.importlinter.contracts]]
name = "Geteilte Pakete kennen keine Services"
type = "forbidden"
source_modules = ["va_contracts", "va_platform"]
forbidden_modules = ["va_market_data", "va_scoring", "va_notification"]

[[tool.importlinter.contracts]]
name = "Contracts sind reine Datenformate"
type = "forbidden"
source_modules = ["va_contracts"]
forbidden_modules = ["va_platform"]

[[tool.importlinter.contracts]]
name = "Contracts ohne Datenverarbeitung, Datenbank und Provider"
type = "forbidden"
source_modules = ["va_contracts"]
forbidden_modules = ["pandas", "numpy", "sqlalchemy", "psycopg", "yfinance"]

[[tool.importlinter.contracts]]
name = "Domain ohne Ein-/Ausgabe (Provider, HTTP, Datenbank)"
type = "forbidden"
source_modules = ["va_market_data.domain", "va_scoring.domain", "va_notification.domain"]
forbidden_modules = ["yfinance", "requests", "sqlalchemy", "psycopg", "alembic"]

[[tool.importlinter.contracts]]
name = "Neue Pakete haengen nicht am Altbestand src"
type = "forbidden"
source_modules = ["va_contracts", "va_platform", "va_market_data", "va_scoring", "va_notification"]
forbidden_modules = ["src"]

# ----------------------------------------------------------------------------
# Ruff: Linting + Formatting (ersetzt black/isort/flake8/pyupgrade)
# ----------------------------------------------------------------------------
[tool.ruff]
# Keine target-version: Ruff leitet sie aus project.requires-python ab (eine Quelle).
line-length = 100
extend-exclude = ["data", "logs", ".venv", "build", "dist"]

[tool.ruff.lint]
select = [
    "E", "W",      # pycodestyle
    "F",           # pyflakes
    "I",           # isort
    "B",           # bugbear
    "UP",          # pyupgrade
    "SIM",         # simplify
    "PL",          # pylint subset
    "RUF",         # ruff specific
    "TCH",         # type-checking
    "PT",          # pytest style
    "RET",         # return statements
    "C4",          # comprehensions
    "ARG",         # unused arguments
    "PTH",         # use pathlib
]
ignore = [
    "E501",        # line too long (formatter handles)
    "TC003",       # stdlib import in TYPE_CHECKING block - kosmetisch
    "TC001",       # first-party import in TYPE_CHECKING block - kosmetisch
    "PLR0913",     # too many arguments
    "PLR2004",     # magic value comparison (too noisy in tests)
    "PLR0912",     # too many branches
    "PLR0915",     # too many statements
    "B008",        # function call in default arg (Depends pattern)
]

[tool.ruff.lint.isort]
# Eigene Pakete: der Altbestand und die Workspace-Mitglieder (P1.1)
known-first-party = [
    "src",
    "va_contracts",
    "va_platform",
    "va_market_data",
    "va_scoring",
    "va_notification",
]

[tool.ruff.lint.flake8-type-checking]
# Pydantic wertet Annotationen zur Laufzeit aus: Ihre Imports bleiben ausserhalb von
# TYPE_CHECKING (sonst scheitert das Modell erst beim Validieren)
runtime-evaluated-base-classes = ["pydantic.BaseModel", "va_contracts.base.Contract"]

[tool.ruff.lint.per-file-ignores]
# Tests duerfen "dict(...)" verwenden, lokale Imports nutzen, etc.
"tests/**/*.py" = [
    "ARG", "PLR2004", "S101",
    "C408",         # dict(...) statt {} - lesbarer in Mock-Daten
    "PT018",        # compound asserts
    "B007",         # unused loop variable
    "RUF059",       # unused tuple unpacking
    "PLC0415",      # local import in test methods OK
]
"src/data_fetcher.py" = ["TC001", "TC003"]  # Ticker/Path werden zur Laufzeit gebraucht
"src/healthcheck.py" = ["TC002"]
"src/mailer.py" = ["TC001", "TC003"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ----------------------------------------------------------------------------
# Pytest
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "7.0"
# Service-Tests liegen beim Service (code-struktur.md), Rest unter tests/
testpaths = ["tests", "services/market-data/tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
]
filterwarnings = [
    "ignore::DeprecationWarning:yfinance",
    "ignore::FutureWarning:yfinance",
]

# ----------------------------------------------------------------------------
# Pyright: statische Typpruefung
# ----------------------------------------------------------------------------
[tool.pyright]
include = ["src", "tests", "docker", "packages", "services", "migrations"]
exclude = ["**/__pycache__", "data", "logs", "build"]
# Keine pythonVersion: Pyright nimmt die Version des Interpreters aus .venv (uv run).
# Linux fest: Der Code laeuft nur im Container; unter Windows prueft Pyright sonst
# gegen andere Stubs (z. B. mmap ohne PROT_*) als in der CI.
pythonPlatform = "Linux"
typeCheckingMode = "standard"
reportMissingImports = true
reportMissingTypeStubs = false
reportUnusedImport = "warning"
reportUnusedVariable = "warning"
reportGeneralTypeIssues = "warning"
reportOptionalMemberAccess = "warning"

# ----------------------------------------------------------------------------
# Coverage (optional, fuer 'make coverage')
# ----------------------------------------------------------------------------
[tool.coverage.run]
source = ["src", "va_contracts"]
omit = ["src/__init__.py", "tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

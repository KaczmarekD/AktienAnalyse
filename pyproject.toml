[project]
name = "value-analyzer"
version = "0.3.0"
description = "Batchweise Value-Aktien-Analyse fuer DAX und MDAX mit wochentlichem E-Mail-Versand"
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Dennis" }]
license = { text = "Proprietary" }
dependencies = [
    "yfinance>=0.2.51,<0.3",
    "pandas>=2.2,<3",
    "numpy>=2.3.2,<3",       # erste Version mit Wheels fuer Python 3.14
    "requests>=2.32,<3",
    "openpyxl>=3.1,<4",       # Deka-XLSX (Universum)
    "jinja2>=3.1,<4",
    "pyarrow>=22,<26",        # Altdaten-Import (Parquet); ab 22 Wheels fuer Python 3.14
    "tenacity>=9,<10",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.4,<3",
    "email-validator>=2.0,<3",
    "sqlalchemy>=2.1,<3",
    "psycopg[binary]>=3.3,<4",
    "alembic>=1.20,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "pandas-stubs>=2.2",
    "types-requests>=2.32",
]

# ----------------------------------------------------------------------------
# uv: Workspace-Root (ADR-0004). Abhaengigkeiten stehen oben, die exakten
# Versionen in uv.lock. Aendern: pyproject anpassen, dann `make lock`.
# ----------------------------------------------------------------------------
[tool.uv]
# Anwendung, kein installierbares Paket: Container und Tests starten aus dem
# Repo-Root (python -m src.main), wie bisher mit pip-tools.
package = false
# Gleiche uv-Minor-Version lokal, in der CI und im Docker-Build (reproduzierbare Locks)
required-version = ">=0.12.21,<0.13"

[tool.uv.workspace]
# Ab Phase 1 (P1.1) kommen packages/* und services/* als Mitglieder dazu.
members = []

# ----------------------------------------------------------------------------
# Ruff: Linting + Formatting (ersetzt black/isort/flake8/pyupgrade)
# ----------------------------------------------------------------------------
[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["data", "logs", ".venv", ".venv*", "build", "dist"]

[tool.ruff.lint]
select = [
    "E", "W",      # pycodestyle
    "F",           # pyflakes
    "I",           # isort
    "B",           # bugbear
    "UP",          # pyupgrade
    "SIM",         # simplify
    "PL",          # pylint subset
    "RUF",         # ruff specific
    "TCH",         # type-checking
    "PT",          # pytest style
    "RET",         # return statements
    "C4",          # comprehensions
    "ARG",         # unused arguments
    "PTH",         # use pathlib
]
ignore = [
    "E501",        # line too long (formatter handles)
    "TC003",       # stdlib import in TYPE_CHECKING block - kosmetisch
    "TC001",       # first-party import in TYPE_CHECKING block - kosmetisch
    "PLR0913",     # too many arguments
    "PLR2004",     # magic value comparison (too noisy in tests)
    "PLR0912",     # too many branches
    "PLR0915",     # too many statements
    "B008",        # function call in default arg (Depends pattern)
]

[tool.ruff.lint.per-file-ignores]
# Tests duerfen "dict(...)" verwenden, lokale Imports nutzen, etc.
"tests/**/*.py" = [
    "ARG", "PLR2004", "S101",
    "C408",         # dict(...) statt {} - lesbarer in Mock-Daten
    "PT018",        # compound asserts
    "B007",         # unused loop variable
    "RUF059",       # unused tuple unpacking
    "PLC0415",      # local import in test methods OK
]
"src/data_fetcher.py" = ["TC001", "TC003"]  # Ticker/Path werden zur Laufzeit gebraucht
"src/healthcheck.py" = ["TC002"]
"src/mailer.py" = ["TC001", "TC003"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ----------------------------------------------------------------------------
# Pytest
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
]
filterwarnings = [
    "ignore::DeprecationWarning:yfinance",
    "ignore::FutureWarning:yfinance",
]

# ----------------------------------------------------------------------------
# Pyright: statische Typpruefung
# ----------------------------------------------------------------------------
[tool.pyright]
include = ["src", "tests"]
exclude = ["**/__pycache__", "data", "logs", "build"]
pythonVersion = "3.14"
typeCheckingMode = "standard"
reportMissingImports = true
reportMissingTypeStubs = false
reportUnusedImport = "warning"
reportUnusedVariable = "warning"
reportGeneralTypeIssues = "warning"
reportOptionalMemberAccess = "warning"

# ----------------------------------------------------------------------------
# Coverage (optional, fuer 'make coverage')
# ----------------------------------------------------------------------------
[tool.coverage.run]
source = ["src"]
omit = ["src/__init__.py", "tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

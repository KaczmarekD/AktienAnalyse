# Lokaler Stack (U1, docs/architecture/umgebungen.md). Liegt ueber docker-compose.yml und
# wird nur ueber die make-Targets local-* genutzt, die beide Dateien angeben. Die NAS kennt
# diese Datei nicht.
#
#   make local-up    Datenbank, NATS, Mailpit (http://localhost:8025), pgweb
#                    (http://localhost:8081), web-api (http://localhost:8000/api/docs) und der
#                    die drei Services, die die Runs aus dem UI ausfuehren (P4.7, P5.1)
#   make local-run   ein Lauf mit dem Arbeitsstand, die Mail landet in Mailpit
#
# Alle Ports nur auf 127.0.0.1. Lokal geht keine Mail nach aussen und kein Healthcheck-Ping
# raus, auch wenn die .env echte Zugangsdaten enthaelt.

# Eigener Projekt- und Containername: kollidiert nicht mit einem Stack aus docker-compose.yml
# auf demselben Rechner, egal aus welchem Ordner (Worktree) gestartet
name: value-analyzer-local

services:
  db:
    container_name: value-analyzer-local-db
    # Eigene Daten, getrennt von ./pgdata der NAS-Definition
    volumes:
      - ./.local/pgdata:/var/lib/postgresql
    # !override: DB_LAN_BIND aus der .env gilt lokal nicht. LOCAL_DB_PORT, falls 5432 belegt ist.
    ports: !override
      - "127.0.0.1:${LOCAL_DB_PORT:-5432}:5432"

  nats:
    container_name: value-analyzer-local-nats
    # Eigene Daten, getrennt von ./natsdata der NAS-Definition; dieselben Nutzer (D1.5)
    volumes: !override
      - ./.local/natsdata:/data
      - ./docker/nats/nats.conf:/etc/nats/nats.conf:ro
    # Fuer make run/api und make nats-provision aus der .venv (als Nutzer batch, D1.5)
    ports:
      - "127.0.0.1:4222:4222"

  value-analyzer:
    container_name: value-analyzer-local
    # Aus dem Arbeitsstand gebaut statt aus GHCR
    image: value-analyzer:local
    build:
      context: .
      target: runtime
    # make local-up startet ihn nicht (kein Cron), make local-run startet einen Lauf
    profiles: ["run"]
    restart: "no"
    environment:
      # Fest, schlaegt die .env: kein Versand nach aussen, kein Ping auf den Healthcheck der NAS
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_PLAIN: "true"
      HEALTHCHECK_URL: ""
      # Fuer EVENT_BUS=nats aus der .env (P4.3); ohne den Schalter ungenutzt. Seit D1.5 als
      # NATS-Nutzer batch (alle Rechte, wie va_app in der Datenbank)
      NATS_URL: nats://batch:${NATS_BATCH_PASSWORD:?NATS_BATCH_PASSWORD in .env setzen}@nats:4222
      # Pfade im Container, auch wenn die .env sie fuer make run/dry aus der .venv setzt
      DATA_DIR: /app/data
      LOGS_DIR: /app/logs
    volumes:
      - ./.local/logs:/app/logs

  # P5.1: die drei Services wie auf der NAS, aber aus dem App-Image des Arbeitsstands mit ihrem
  # eigenen Einstieg (kein weiteres Image auf der knappen Platte). make local-up startet sie
  # mit dem Profil nats.
  market-data:
    container_name: value-analyzer-local-market-data
    image: value-analyzer:local
    pull_policy: never
    restart: "no"
    entrypoint: ["python", "-m", "va_market_data"]

  scoring:
    container_name: value-analyzer-local-scoring
    image: value-analyzer:local
    pull_policy: never
    restart: "no"
    entrypoint: ["python", "-m", "va_scoring"]

  notification:
    container_name: value-analyzer-local-notification
    image: value-analyzer:local
    pull_policy: never
    restart: "no"
    entrypoint: ["python", "-m", "va_notification"]
    environment:
      # Wie beim Batch: kein Versand nach aussen, kein Ping auf den Healthcheck der NAS
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_PLAIN: "true"
      HEALTHCHECK_URL: ""
      DATA_DIR: /app/data

  mailpit:
    # Postfach im Browser; nimmt jede Mail an und verschickt nichts
    image: axllent/mailpit:v1.31.6
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"  # Weboberflaeche
      - "127.0.0.1:1025:1025"  # SMTP, auch fuer make run/dry aus der .venv

  migrate:
    container_name: value-analyzer-local-migrate
    image: value-analyzer:local
    pull_policy: never

  web-api:
    # Wie auf der NAS (docker-compose.yml), aber aus dem App-Image des Arbeitsstands (gebaut von
    # make local-up) und lokal direkt erreichbar, mit Swagger unter /api/docs
    container_name: value-analyzer-local-web-api
    image: value-analyzer:local
    pull_policy: never
    entrypoint:
      ["python", "-m", "uvicorn", "--factory", "va_web_api.main:create_app",
       "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # Lokal keine Wochenlaeufe von selbst (Runs startet das UI oder make local-run)
      WEB_API_SCHEDULE: ""
      WEB_API_PRICE_SCHEDULE: ""  # D2.3: lokal keine Tageskurse nach Plan
      # D1.1: lokal ohne HTTPS, das Sitzungs-Cookie darf nicht Secure sein
      WEB_API_COOKIE_SECURE: "false"
      # D1.4: lokal mit Login-Seite, also mit Sitzungspflicht (die NAS folgt mit HTTPS in D1.5).
      # Erstes Konto: make local-admin NAME=<name>
      WEB_API_AUTH_REQUIRED: "true"

  frontend:
    # nginx mit dem Build aus dem Arbeitsstand (make local-ui). Nur auf Wunsch: Der Node-Build
    # braucht viel Platz, zum Entwickeln gibt es make ui (ng serve mit Reload).
    container_name: value-analyzer-local-frontend
    image: va-frontend:local
    build:
      context: ./frontend
    profiles: ["ui"]
    environment:
      VA_SERVER_NAMES: localhost 127.0.0.1
    ports: !override
      - "127.0.0.1:8080:8080"

  pgweb:
    # Datenbank im Browser, nur lesend: Rolle va_read und --readonly
    image: sosedoff/pgweb:0.17.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGWEB_DATABASE_URL: postgres://va_read:${VA_READ_PASSWORD}@db:5432/value_analyzer?sslmode=disable
    command: ["/usr/bin/pgweb", "--bind=0.0.0.0", "--listen=8081", "--readonly"]
    ports:
      - "127.0.0.1:8081:8081"

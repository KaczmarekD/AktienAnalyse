name: CI

on:
  push:
    # Feature-Branches: Ein Paket wird erst gepusht, wenn es lokal gruen ist,
    # die CI bestaetigt das vor dem Merge (Implementierungsplan, Arbeitsweise).
    branches: [main, master, "feat/**"]
    # Tag v<Version>: zusaetzlich ein Image mit der Versionsnummer (P0.6b)
    tags: ["v*"]
    # Bewusst ohne Pfad-Filter: Jeder Stand bekommt einen Status, auch reine
    # Doku-Aenderungen (sonst haengen Pflicht-Checks). Filter erst mit mehreren
    # Workflows (Python, Frontend, Images).
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Standard fuer alle Jobs: nur lesen. Der Image-Job erweitert das um packages: write.
permissions:
  contents: read

concurrency:
  # Pro Branch: Push- und PR-Lauf desselben Branches ersetzen sich gegenseitig
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint + Type-Check + Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # DB-Tests laufen gegen den Service-Container (jede Testfunktion: eigene DB)
      TEST_DATABASE_URL: postgresql+psycopg://postgres:test@localhost:5432/postgres
      # Jeder uv-Aufruf bricht ab, wenn uv.lock nicht zu pyproject.toml passt,
      # und lockt nie still neu
      UV_LOCKED: "1"

    steps:
      - uses: actions/checkout@v7

      # Python-Version kommt aus .python-version (eine Quelle mit requires-python)
      - name: uv installieren
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.21"
          enable-cache: true

      - name: Dependencies exakt aus uv.lock
        run: uv sync

      - name: Ruff Lint
        run: uv run ruff check src tests docker packages services migrations

      - name: Ruff Format Check
        run: uv run ruff format --check src tests docker packages services migrations

      - name: Pyright Type-Check (wie make typecheck)
        run: uv run pyright

      - name: Import-Grenzen (wie make imports)
        run: uv run lint-imports

      - name: Migrationen gegen leere DB pruefen
        env:
          DATABASE_OWNER_URL: postgresql+psycopg://postgres:test@localhost:5432/postgres
        run: |
          uv run python -m src.db.migrate
          uv run alembic check

      - name: Pytest
        run: uv run pytest --cov=src --cov=va_contracts --cov=va_platform --cov=va_market_data --cov=va_scoring --cov=va_notification --cov=va_web_api --cov-report=xml --cov-report=term

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  # Angular-Frontend (P3.5): Node laeuft nur hier und lokal, nie auf der NAS (ADR-0008).
  # Der API-Client wird aus dem OpenAPI-Snapshot erzeugt und muss zu ihm passen.
  frontend:
    name: Frontend Lint + Test + Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Node 24 LTS
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Dependencies exakt aus package-lock.json
        run: npm ci

      - name: API-Client passt zum OpenAPI-Snapshot
        run: |
          npm run generate:api
          git diff --exit-code -- src/app/api || {
            echo "::error::src/app/api passt nicht zu tests/golden/openapi/v1.json - npm run generate:api ausfuehren und committen"
            exit 1
          }
          test -z "$(git status --porcelain -- src/app/api)" || {
            echo "::error::npm run generate:api erzeugt neue Dateien - ausfuehren und committen"
            exit 1
          }

      - name: Format (Prettier)
        run: npm run format:check

      - name: Lint (ESLint)
        run: npm run lint

      - name: Tests (Vitest)
        run: npm test -- --watch=false

      - name: Build (Produktion)
        run: npm run build

  # Images entstehen nur hier und nur fuer getestete Commits (needs: quality). Die NAS
  # baut nichts selbst, sie zieht das Image aus GHCR (P0.6b, ADR-0008).
  docker-build:
    name: Docker Build + J4125-Pruefung
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: read
      # Gilt fuer den ganzen Job, genutzt wird es nur beim Push (main und Tags v*)
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Eigene Cache-Scopes je Stufe, sonst ueberschreiben sich die Builds gegenseitig
      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          push: false
          load: true
          tags: value-analyzer:ci
          # Verknuepft das Paket in GHCR mit dem Repository
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,scope=runtime,mode=max

      # P0.6b: Die App muss im fertigen Image starten koennen (ohne DB, ohne Migration)
      - name: Smoke-Test im Image
        run: docker run --rm --entrypoint python value-analyzer:ci -c "import src.main"

      # P3.6: das UI hinter nginx, zusammen mit dem web-api aus dem Image oben
      - name: Frontend-Image bauen
        run: docker build -t va-frontend:ci frontend

      # U5.2: die ganze Kette mit Replay-Daten statt Yahoo, mit genau diesen Images: Batch,
      # Mail in Mailpit, web-api hinter nginx, UI. Die Pruefungen (tests/e2e) laufen mit uv.
      - name: uv installieren (E2E-Pruefungen)
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.21"
          enable-cache: true

      # U5.3: der Browser-Test (Playwright) laeuft mit Node auf dem Runner, nie auf der NAS
      - name: Node 24 LTS (Browser-Test)
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Playwright mit Chromium
        working-directory: frontend
        env:
          PLAYWRIGHT_BROWSERS_PATH: ../.local/playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: E2E (ganze Kette mit Replay-Daten)
        env:
          E2E_APP_IMAGE: value-analyzer:ci
          E2E_FRONTEND_IMAGE: va-frontend:ci
        run: docker/e2e.sh

      # P0.6b: Die NAS baut nicht selbst, Compose zieht das Image aus GHCR
      - name: Compose nutzt das Image aus GHCR
        run: |
          cp .env.example .env
          images=$(docker compose config --images)
          echo "$images"
          grep -qx "ghcr.io/kaczmarekd/value-analyzer:latest" <<< "$images"
          grep -qx "ghcr.io/kaczmarekd/va-frontend:latest" <<< "$images"

      # ADR-0008: dieselben Pakete wie im Laufzeit-Image, unter QEMU mit einem
      # CPU-Modell ohne AVX (J4125 der NAS). Wie make check-j4125.
      - name: J4125-Image bauen
        uses: docker/build-push-action@v7
        with:
          context: .
          target: j4125-check
          platforms: linux/amd64
          load: true
          tags: value-analyzer:j4125-check
          cache-from: |
            type=gha,scope=runtime
            type=gha,scope=j4125-check
          cache-to: type=gha,scope=j4125-check,mode=max

      - name: J4125-Pruefung (QEMU, ohne AVX)
        # Lokal unter 20 Sekunden; die Grenze faengt nur einen haengenden Lauf ab
        timeout-minutes: 10
        run: docker run --rm value-analyzer:j4125-check

      - name: Bei GHCR anmelden
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Getestet ist genau dieses Image: Smoke-Test und J4125-Pruefung liefen oben.
      # Tags aus docker/image_tags.py: sha-<commit>, latest nur am Kopf von main,
      # <version> bei einem Tag vX.Y.Z passend zu pyproject.toml. Passt ein Tag nicht,
      # endet der Schritt vor dem ersten Push.
      - name: Image nach GHCR schieben
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        run: |
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          tags=$(python3 docker/image_tags.py)
          for tag in $tags; do
            # Batch und web-api (ein Image), dazu das frontend (P3.6) mit denselben Tags
            for image in value-analyzer va-frontend; do
              docker tag "$image:ci" "$registry/$image:$tag"
              docker push "$registry/$image:$tag"
            done
          done

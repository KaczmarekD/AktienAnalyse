name: CI

on:
  push:
    # Feature-Branches: Ein Paket wird erst gepusht, wenn es lokal gruen ist,
    # die CI bestaetigt das vor dem Merge (Implementierungsplan, Arbeitsweise).
    branches: [main, master, "feat/**"]
    # Reine Doku-Aenderungen brauchen keinen Testlauf. Weitere Pfad-Filter kommen,
    # sobald es mehrere Workflows gibt (Python, Frontend, Images).
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    branches: [main, master]
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint + Type-Check + Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
      fail-fast: false

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # DB-Tests laufen gegen den Service-Container (jede Testfunktion: eigene DB)
      TEST_DATABASE_URL: postgresql+psycopg://postgres:test@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.lock

      - name: Ruff Lint
        run: ruff check src tests

      - name: Ruff Format Check
        run: ruff format --check src tests

      - name: Pyright Type-Check
        run: pyright src

      - name: Migrationen gegen leere DB pruefen
        run: |
          DATABASE_OWNER_URL=postgresql+psycopg://postgres:test@localhost:5432/postgres             python -m src.db.migrate
          DATABASE_OWNER_URL=postgresql+psycopg://postgres:test@localhost:5432/postgres             alembic check

      - name: Pytest
        run: pytest --cov=src --cov-report=xml --cov-report=term

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  docker-build:
    name: Docker Build (smoke test)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: value-analyzer:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

name: CI

on:
  push:
    # Feature-Branches: Ein Paket wird erst gepusht, wenn es lokal gruen ist,
    # die CI bestaetigt das vor dem Merge (Implementierungsplan, Arbeitsweise).
    branches: [main, master, "feat/**"]
    # Bewusst ohne Pfad-Filter: Jeder Stand bekommt einen Status, auch reine
    # Doku-Aenderungen (sonst haengen Pflicht-Checks). Filter erst mit mehreren
    # Workflows (Python, Frontend, Images).
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  # Pro Branch: Push- und PR-Lauf desselben Branches ersetzen sich gegenseitig
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint + Type-Check + Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
      fail-fast: false

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # DB-Tests laufen gegen den Service-Container (jede Testfunktion: eigene DB)
      TEST_DATABASE_URL: postgresql+psycopg://postgres:test@localhost:5432/postgres
      # Jeder uv-Aufruf bricht ab, wenn uv.lock nicht zu pyproject.toml passt,
      # und lockt nie still neu
      UV_LOCKED: "1"

    steps:
      - uses: actions/checkout@v4

      - name: uv und Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.21"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Dependencies exakt aus uv.lock
        run: uv sync

      - name: Ruff Lint
        run: uv run ruff check src tests

      - name: Ruff Format Check
        run: uv run ruff format --check src tests

      - name: Pyright Type-Check (wie make typecheck)
        run: uv run pyright

      - name: Migrationen gegen leere DB pruefen
        env:
          DATABASE_OWNER_URL: postgresql+psycopg://postgres:test@localhost:5432/postgres
        run: |
          uv run python -m src.db.migrate
          uv run alembic check

      - name: Pytest
        run: uv run pytest --cov=src --cov-report=xml --cov-report=term

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  docker-build:
    name: Docker Build (smoke test)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: value-analyzer:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

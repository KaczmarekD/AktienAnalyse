services:
  db:
    image: postgres:18
    container_name: value-analyzer-db
    restart: unless-stopped
    environment:
      TZ: Europe/Berlin
      POSTGRES_DB: value_analyzer
      POSTGRES_USER: va_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD in .env setzen}
      # Nur beim allerersten Start (leeres pgdata/) von db/init/01_roles.sh genutzt
      VA_APP_PASSWORD: ${VA_APP_PASSWORD:?VA_APP_PASSWORD in .env setzen}
      VA_READ_PASSWORD: ${VA_READ_PASSWORD:?VA_READ_PASSWORD in .env setzen}
      # P3.3: Rolle fuer die Profil-Befehle des web-api. In einer bestehenden Datenbank legt
      # sie der Dienst migrate an (python -m src.db.migrate)
      VA_PROFILES_PASSWORD: ${VA_PROFILES_PASSWORD:?VA_PROFILES_PASSWORD in .env setzen}
      # P4.4: Rolle fuer die Projektionen und Runs des web-api (Schema web, batch.run)
      VA_WEB_PASSWORD: ${VA_WEB_PASSWORD:-}
      # P5.3: je Service eine Rolle nur fuers eigene Schema. In einer bestehenden Datenbank legt
      # der Dienst migrate sie an
      VA_MARKET_DATA_PASSWORD: ${VA_MARKET_DATA_PASSWORD:-}
      VA_SCORING_PASSWORD: ${VA_SCORING_PASSWORD:-}
      VA_NOTIFICATION_PASSWORD: ${VA_NOTIFICATION_PASSWORD:-}
      # D1.1: Konten und Sitzungen des web-api (Schema identity)
      VA_IDENTITY_PASSWORD: ${VA_IDENTITY_PASSWORD:-}
    volumes:
      # Ab PostgreSQL 18 liegt der Mountpunkt eine Ebene hoeher (nicht mehr .../data).
      # Bind-Mount statt Named Volume: 'docker compose down -v' kann ihn nicht loeschen,
      # und Hyper Backup sichert ihn mit.
      - ./pgdata:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      # Nur im LAN: DB_LAN_BIND auf die NAS-IP setzen (Default: nur lokal erreichbar)
      - "${DB_LAN_BIND:-127.0.0.1}:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U va_owner -d value_analyzer"]
      interval: 10s
      timeout: 5s
      retries: 12
    shm_size: 128mb

  nats:
    # Event-Bus (Phase 4, ADR-0002): JetStream mit Daten in ./natsdata (wie pgdata: Bind-Mount,
    # Hyper Backup sichert ihn mit). Nur im Docker-Netz erreichbar. Stream und Consumer legt jeder
    # Teilnehmer beim Start an (provision, P4.1); seit P5.4 der Standard.
    image: nats:2.15.1-alpine
    container_name: value-analyzer-nats
    restart: unless-stopped
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - ./natsdata:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz?js-enabled-only=true"]
      interval: 10s
      timeout: 5s
      retries: 6

  migrate:
    # P5.4: Schema migrieren und Rollen anlegen, einmal vor allen anderen; endet danach
    image: ${REG:-ghcr.io/kaczmarekd}/value-analyzer:${VERSION:-latest}
    container_name: value-analyzer-migrate
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["python", "-m", "src.db.migrate"]
    environment:
      TZ: Europe/Berlin
      DATABASE_OWNER_URL: postgresql+psycopg://va_owner:${POSTGRES_PASSWORD}@db:5432/value_analyzer
      # Rollen, die nach dem ersten Start dazukommen, legt die Migration mit diesen Passwoertern an
      VA_PROFILES_PASSWORD: ${VA_PROFILES_PASSWORD:-}
      VA_WEB_PASSWORD: ${VA_WEB_PASSWORD:?VA_WEB_PASSWORD in .env setzen}
      VA_MARKET_DATA_PASSWORD: ${VA_MARKET_DATA_PASSWORD:?VA_MARKET_DATA_PASSWORD in .env setzen}
      VA_SCORING_PASSWORD: ${VA_SCORING_PASSWORD:?VA_SCORING_PASSWORD in .env setzen}
      VA_NOTIFICATION_PASSWORD: ${VA_NOTIFICATION_PASSWORD:?VA_NOTIFICATION_PASSWORD in .env setzen}
      VA_IDENTITY_PASSWORD: ${VA_IDENTITY_PASSWORD:?VA_IDENTITY_PASSWORD in .env setzen}

  value-analyzer:
    # Fertiges Image aus der CI (P0.6b, ADR-0008) - die NAS baut nicht selbst.
    # VERSION in der .env: latest folgt main, sha-<commit> oder eine Version pinnt.
    # Lokal statt aus GHCR: make build (baut und taggt unter demselben Namen).
    # P5.4: kein Cron mehr, den Wochenlauf plant das web-api. Der Batch laeuft nur auf Wunsch
    # (Profil run): Lauf im Prozess, Dry-Run, Regression, Import.
    image: ${REG:-ghcr.io/kaczmarekd}/value-analyzer:${VERSION:-latest}
    container_name: value-analyzer
    profiles: ["run"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - TZ=Europe/Berlin
      # App-Rolle ohne Loeschrechte; die Owner-Rolle nur fuer Migrationen beim Start
      - DATABASE_URL=postgresql+psycopg://va_app:${VA_APP_PASSWORD}@db:5432/value_analyzer
      - DATABASE_OWNER_URL=postgresql+psycopg://va_owner:${POSTGRES_PASSWORD}@db:5432/value_analyzer
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    # Manueller Run im Prozess (sonst ueber das UI, Seite Runs):
    #   docker compose run --rm value-analyzer python -m src.main
    # Dry-Run:
    #   docker compose run --rm value-analyzer python -m src.main --dry-run
    # Altdaten importieren (einmalig, mehrfach ausfuehrbar):
    #   docker compose run --rm value-analyzer python -m src.db.import_legacy /app/data

  # P5.1: ein Container je Service aus seinem eigenen Image (uv sync --package). Sie fuehren
  # die Runs ueber NATS aus und beantworten Request/Reply des web-api; seit P5.4 der Standard.
  # Jeder sieht nur seine Variablen, SMTP nur notification, und seit P5.3 seine eigene Rolle
  # (nur das eigene Schema). Leer heisst Standardwert. Zuerst laeuft die Migration (migrate).
  market-data:
    image: ${REG:-ghcr.io/kaczmarekd}/va-market-data:${VERSION:-latest}
    container_name: value-analyzer-market-data
    restart: unless-stopped
    depends_on: &service-depends-on
      db:
        condition: service_healthy
      nats:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      TZ: Europe/Berlin
      DATABASE_URL: postgresql+psycopg://va_market_data:${VA_MARKET_DATA_PASSWORD:?VA_MARKET_DATA_PASSWORD in .env setzen}@db:5432/value_analyzer
      NATS_URL: nats://nats:4222
      RUN_TIMEOUT_MINUTES: ${RUN_TIMEOUT_MINUTES:-}
      OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-}
      UNIVERSE: ${UNIVERSE:-}
      DEFAULT_TAX_RATE: ${DEFAULT_TAX_RATE:-}
    volumes:
      # Fallback-CSV wie beim Batch aus ./data (von Hand gepflegt)
      - ./data:/app/data:ro

  scoring:
    image: ${REG:-ghcr.io/kaczmarekd}/va-scoring:${VERSION:-latest}
    container_name: value-analyzer-scoring
    restart: unless-stopped
    depends_on: *service-depends-on
    environment:
      TZ: Europe/Berlin
      DATABASE_URL: postgresql+psycopg://va_scoring:${VA_SCORING_PASSWORD:?VA_SCORING_PASSWORD in .env setzen}@db:5432/value_analyzer
      NATS_URL: nats://nats:4222
      RUN_TIMEOUT_MINUTES: ${RUN_TIMEOUT_MINUTES:-}
      OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-}
      # Nur Startwerte fuer das Profil "Standard" (ADR-0009)
      MIN_MARKET_CAP: ${MIN_MARKET_CAP:-}
      VALUE_WEIGHT: ${VALUE_WEIGHT:-}
      QUALITY_WEIGHT: ${QUALITY_WEIGHT:-}

  notification:
    image: ${REG:-ghcr.io/kaczmarekd}/va-notification:${VERSION:-latest}
    container_name: value-analyzer-notification
    restart: unless-stopped
    depends_on: *service-depends-on
    environment:
      TZ: Europe/Berlin
      DATABASE_URL: postgresql+psycopg://va_notification:${VA_NOTIFICATION_PASSWORD:?VA_NOTIFICATION_PASSWORD in .env setzen}@db:5432/value_analyzer
      NATS_URL: nats://nats:4222
      RUN_TIMEOUT_MINUTES: ${RUN_TIMEOUT_MINUTES:-}
      OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_TO: ${MAIL_TO:-}
      MAIL_SUBJECT_PREFIX: ${MAIL_SUBJECT_PREFIX:-}
      TOP_N: ${TOP_N:-}
      BOTTOM_N: ${BOTTOM_N:-}
      HEALTHCHECK_URL: ${HEALTHCHECK_URL:-}
    volumes:
      # Vorschau eines Dry-Runs (HTML und CSV), wie beim Batch
      - ./data:/app/data

  web-api:
    # REST und WebSocket fuer das UI, ohne Port: Nur das frontend (nginx) erreicht es im internen
    # Docker-Netz. Seit P5.4 das eigene Image (P5.1) mit NATS: Projektionen (va_web), Request/Reply
    # an die Services, Run-Verwaltung mit Watchdog und der Scheduler fuer den Wochenlauf
    # (CRON_SCHEDULE aus der .env, Europe/Berlin), der den Cron im Container ersetzt.
    image: ${REG:-ghcr.io/kaczmarekd}/va-web-api:${VERSION:-latest}
    container_name: value-analyzer-web-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      nats:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Bewusst ohne env_file: keine Zugangsdaten des Batches. Lesen mit va_read (schreibgeschuetzt),
    # Projektionen und Runs mit va_web
    environment:
      TZ: Europe/Berlin
      WEB_API_DATABASE_URL: postgresql+psycopg://va_read:${VA_READ_PASSWORD}@db:5432/value_analyzer
      WEB_API_NATS_URL: nats://nats:4222
      WEB_API_PROJECTIONS_DATABASE_URL: postgresql+psycopg://va_web:${VA_WEB_PASSWORD:?VA_WEB_PASSWORD in .env setzen}@db:5432/value_analyzer
      # D1.1: Konten und Sitzungen. Das Cookie ist Secure: anmelden erst mit HTTPS (D1.5)
      WEB_API_IDENTITY_DATABASE_URL: postgresql+psycopg://va_identity:${VA_IDENTITY_PASSWORD:?VA_IDENTITY_PASSWORD in .env setzen}@db:5432/value_analyzer
      WEB_API_SCHEDULE: ${CRON_SCHEDULE:-30 7 * * 6}
      WEB_API_OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-none}

  frontend:
    # Einziger Einstieg im LAN (P3.6, ADR-0005/0007): Angular-Build und /api/ an das web-api.
    # Das Image entsteht in der CI (Node laeuft nie auf der NAS).
    image: ${REG:-ghcr.io/kaczmarekd}/va-frontend:${VERSION:-latest}
    container_name: value-analyzer-frontend
    restart: unless-stopped
    depends_on:
      - web-api
    environment:
      # Hostnamen, unter denen das UI im Browser aufgerufen wird; alle anderen bekommen keine
      # Antwort (Schutz vor DNS-Rebinding)
      VA_SERVER_NAMES: ${UI_SERVER_NAMES:-localhost 127.0.0.1}
    ports:
      # Nur im LAN: UI_LAN_BIND auf die NAS-IP setzen (Default: nur auf der NAS selbst).
      # Die DSM-Firewall sollte Port 8080 auf das Heimnetz beschraenken.
      - "${UI_LAN_BIND:-127.0.0.1}:8080:8080"

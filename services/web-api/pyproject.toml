[project]
name = "va-web-api"
version = "0.1.0"
description = "Service web-api: REST fuer das Frontend (Backend for Frontend, Phase 3)"
requires-python = ">=3.14"
dependencies = [
    "va-platform",
    "fastapi>=0.160,<1",
    "uvicorn>=0.54,<1",  # ohne [standard]: reines Python, nichts Natives fuer den J4125
    "websockets>=16,<17",  # P4.5: WebSocket in Uvicorn; bisher nur ueber yfinance im Image
    "pydantic>=2.7,<3",  # wie im Root-Projekt
    "pydantic-settings>=2.4,<3",
    "sqlalchemy>=2.1,<3",
    "cronsim>=2.7,<3",
    "tzdata>=2025.2",
]

[build-system]
requires = ["uv_build>=0.12.21,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
va-platform = { workspace = true }

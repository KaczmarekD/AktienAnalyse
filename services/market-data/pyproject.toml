[project]
name = "va-market-data"
version = "0.1.0"
description = "Service market-data: Universum, Marktdaten, Kennzahlen"
requires-python = ">=3.14"
dependencies = [
    "va-contracts",
    "va-platform",
    "numpy>=2.3.2,<3",  # wie im Root-Projekt
    "openpyxl>=3.1,<4",  # Deka-XLSX
    "pandas>=3.0,<4",
    "requests>=2.32,<3",
    "sqlalchemy>=2.1,<3",  # Adapter postgres (P1.7)
    "tenacity>=9,<10",
    "yfinance>=1.7,<2",
]

[build-system]
requires = ["uv_build>=0.12.21,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
va-contracts = { workspace = true }
va-platform = { workspace = true }

[project]
name = "va-scoring"
version = "0.1.0"
description = "Service scoring: Value-/Quality-Ranking"
requires-python = ">=3.14"
dependencies = [
    "va-contracts",
    "va-platform",
    "numpy>=2.3.2,<3",  # wie im Root-Projekt
    "pandas>=3.0,<4",
    "pydantic>=2.13,<3",  # ScoringProfileParams (P2b.2), wie in va-contracts
    "sqlalchemy>=2.1,<3",  # Adapter postgres (P1.7)
]

[build-system]
requires = ["uv_build>=0.12.21,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
va-contracts = { workspace = true }
va-platform = { workspace = true }

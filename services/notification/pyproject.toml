[project]
name = "va-notification"
version = "0.1.0"
description = "Service notification: Report und Versand"
requires-python = ">=3.14"
dependencies = [
    "va-contracts",
    "va-platform",
    "jinja2>=3.1,<4",  # wie im Root-Projekt
    "pandas>=3.0,<4",
    "requests>=2.32,<3",
]

[build-system]
requires = ["uv_build>=0.12.21,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
va-contracts = { workspace = true }
va-platform = { workspace = true }

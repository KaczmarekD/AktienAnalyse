# Alembic-Konfiguration fuer die CLI (alembic revision --autogenerate ...).
# Zur Laufzeit migriert src/db/migrate.py ohne diese Datei.
# Die Datenbank-URL kommt aus DATABASE_OWNER_URL bzw. DATABASE_URL (siehe migrations/env.py).

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
